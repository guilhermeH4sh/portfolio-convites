<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#502a31" />
  <meta name="description" content="Coleção de convites digitais de casamento. Designs exclusivos, delicados e interativos." />
  <title>Ateliê de Convites — Portfólio</title>
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="apple-touch-icon" href="assets/logo.png" />
  <link rel="shortcut icon" href="favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Italianno&display=swap" rel="stylesheet" />
  <style>
    /* 01 — Sistema visual */
    :root {
      color-scheme: dark;
      --wine: #502a31;
      --wine-light: #694047;
      --champagne: #e5d6c6;
      --gold: #c5a987;
      --gold-dim: rgba(217,185,146,.55);
      --ui: 'DM Sans', 'Inter', Arial, sans-serif;
      --serif: 'Cormorant Garamond', 'GFS Didot', Georgia, serif;
      --script: 'Italianno', 'URW Chancery L', 'Brush Script MT', cursive;
      --ease: cubic-bezier(.22,1,.36,1);
      --card-width: min(420px, 76vw, calc(77svh * .68));
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body { overflow-x: hidden; background: var(--wine); color: var(--champagne); font-family: var(--ui); }
    button { font: inherit; }
    button:focus-visible, .invite-shell:focus-visible { outline: 2px solid #f4dfb9; outline-offset: 6px; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

    /* 02 — Fundo fosco com textura de tecido, sem degradês chamativos */
    .backdrop { position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        radial-gradient(ellipse at 48% 39%, rgba(178,122,123,.13), transparent 61%),
        radial-gradient(ellipse at 100% 95%, rgba(28,10,16,.17), transparent 54%),
        repeating-linear-gradient(90deg, rgba(248,218,210,.012) 0 1px, transparent 1px 4px),
        repeating-linear-gradient(0deg, rgba(12,4,7,.018) 0 1px, transparent 1px 4px),
        #502a31;
    }
    .backdrop::before { content: ''; position:absolute; inset:0; opacity:.26;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.72' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' opacity='.12' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* 03 — Palco central / navegação */
    .portfolio { position:relative; min-height:100svh; display:grid; grid-template-rows:auto minmax(0,1fr) auto; align-items:center; padding: clamp(18px,3.3vh,32px) clamp(18px,4vw,60px) clamp(16px,3vh,26px); isolation:isolate; }
    .micro-header { text-align:center; opacity:0; animation: enter-down .8s .08s var(--ease) forwards; }
    .micro-header__eyebrow { display:inline-flex; gap:13px; align-items:center; color:#ddc3af; font-size:10px; letter-spacing:.35em; text-transform:uppercase; font-weight:500; }
    .micro-header__eyebrow::before, .micro-header__eyebrow::after { content:''; display:block; width:25px; height:1px; background:rgba(222,189,151,.55); }
    .gallery { position:relative; min-height:0; width:min(100%, 1160px); margin:auto; display:grid; grid-template-columns:70px minmax(0,1fr) 70px; align-items:center; justify-items:center; column-gap:clamp(8px,3vw,44px); }
    .stage { width:100%; min-width:0; height: min(78svh, 760px); min-height:340px; display:grid; place-items:center; perspective:1300px; touch-action:pan-y; position:relative; }
    .invite-shell { position:relative; width:var(--card-width); aspect-ratio: 2 / 3; max-height:100%; transform-style:preserve-3d; border:0; background:transparent; padding:0; cursor:zoom-in; opacity:0; transform: translateY(22px) scale(.967); animation:card-intro 1s .16s var(--ease) forwards; will-change:transform,opacity; -webkit-tap-highlight-color: transparent; }
    .invite-shell::after { content:''; position:absolute; inset:0; border-radius:5px; pointer-events:none; box-shadow:0 24px 55px rgba(19,5,9,.26),0 5px 16px rgba(24,7,10,.15); z-index:-1; transition:box-shadow .45s var(--ease); }
    .invite-shell:hover::after {box-shadow:0 35px 75px rgba(19,5,9,.32),0 12px 25px rgba(24,7,10,.19);}
    .invite-shell.is-ready {animation:none;opacity:1;transform:none;}
    .invite-shell.switching, .invite-shell.is-ready.switching { animation: switch-in .5s var(--ease) both; }
    .invite-shell.leaning { transition:transform .24s ease-out; }
    .invite-shell.is-envelope { cursor:default; }
    .nav { display:grid; place-items:center; width:52px; aspect-ratio:1; background:rgba(30,10,18,.045); border:1px solid var(--gold-dim); border-radius:50%; color:#efdfcd; cursor:pointer; transition:border-color .25s, background .25s, transform .3s var(--ease); opacity:0; animation:fade-in .8s .57s forwards; touch-action:manipulation; }
    .nav svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.35; stroke-linecap:round; stroke-linejoin:round; }
    .nav:hover {background:rgba(243,222,199,.09);border-color:#e3c7a3;transform:scale(1.07)}
    .nav:active { transform:scale(.94); }
    .foot { display:flex; align-items:end; justify-content:space-between; gap:20px; width:min(100%,1020px); margin:0 auto; opacity:0; animation:enter-up .8s .38s var(--ease) forwards; }
    .foot__info {display:flex; flex-direction:column;gap:5px;min-width:0}
    .foot__name {font-family:var(--serif);font-weight:500;font-size:clamp(18px,2vw,24px);line-height:1.1;letter-spacing:.02em;}
    .foot__hint {font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.65;white-space:nowrap;}
    .foot__right { display:flex; align-items:center; gap:20px; }
    .counter {font-size:12px;color:#ecdccc;letter-spacing:.14em;font-variant-numeric:tabular-nums;white-space:nowrap}
    .counter span {color:rgba(236,220,204,.55)}
    .progress { width:108px; height:1px; background:rgba(235,211,185,.3); overflow:hidden; }
    .progress span {height:100%;display:block;width:16.666%;background:#ebceab;transition:transform .5s var(--ease);transform-origin:left}

        .site-logo { display:block; height:clamp(38px, 6vh, 52px); width:auto; margin:0 auto 10px; filter:drop-shadow(0 4px 10px rgba(0,0,0,.25)); }
    .paper--art { position:absolute; inset:0; border-radius:4px; overflow:hidden; background:#faf7ef; display:grid; place-items:center; }
    .art-card__img { width:100%; height:100%; object-fit:cover; display:block; }

    /* 04 — Convites autorais feitos com texto real e CSS */
    .paper { position:absolute; inset:0; overflow:hidden; color:var(--ink,#414332); background:var(--paper,#faf7ef); border-radius:4px; text-align:center; container-type:inline-size; box-shadow:inset 0 0 0 .5px rgba(38,24,15,.08); }
    .paper::after {position:absolute;inset:0;content:'';pointer-events:none;opacity:.2;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='p'%3E%3CfeTurbulence baseFrequency='.78' numOctaves='3' type='fractalNoise' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' opacity='.08' filter='url(%23p)'/%3E%3C/svg%3E");}
    .paper__content {position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;}
    .eyebrow {font-family:var(--ui);font-size:2.3cqw;letter-spacing:.27em;text-transform:uppercase;line-height:1.6;font-weight:500;}
    .serif {font-family:var(--serif);font-weight:400;}
    .italic {font-style:italic;}
    .script {font-family:var(--script);font-weight:400;}
    .line {height:1px;background:currentColor;opacity:.45;}
    .data-label {font-size:2.35cqw;letter-spacing:.11em;line-height:1.45;}
    .tiny {font-size:2.3cqw;letter-spacing:.12em;line-height:1.6;}
    .garden-branch-a,.garden-branch-b,.blue-branch-a,.blue-branch-b,.blush-branch-a {position:absolute;pointer-events:none;}
    .flower-branch { position:absolute; width:100%;height:100%;top:0;left:0; overflow:visible; opacity:.95; pointer-events:none; transition:transform 1.2s var(--ease); }
    .paper:hover .flower-branch { transform:translateY(-1.6%) rotate(1.5deg); }
    .botanical-detail {position:absolute;pointer-events:none}
    .seal-icon { width:12cqw;height:12cqw; display:grid;place-items:center; border-radius:50%;border:1px solid currentColor;font-size:6cqw;font-family:var(--serif);font-style:italic; }

    /* 1: Jardim de oliveiras */
    .paper--garden {--paper:#f6f3ea;--ink:#48543e}
    .paper--garden .paper__content { padding:12% 10% 8%; }
    .paper--garden .garden-top {margin-top:3%;}
    .paper--garden .garden-name {font-size:15cqw;line-height:.8;margin-top:17%;color:#536044;}
    .paper--garden .garden-amp {font-size:8cqw;line-height:1.1;font-style:italic;margin:7% 0 3%;}
    .paper--garden .garden-name.second {margin-top:0;}
    .paper--garden .garden-rule {width:32%;margin:11% 0 7%;}
    .paper--garden .garden-date {font-family:var(--serif);font-size:6.6cqw;letter-spacing:.1em;}
    .paper--garden .garden-place {margin-top:6%;}
    .paper--garden .garden-end {margin-top:auto;font-family:var(--serif);font-style:italic;font-size:4cqw;letter-spacing:.025em;}
    .garden-branch-a {left:-24%;top:-20%;width:76%;height:37%}
    .garden-branch-b {right:-26%;bottom:-22%;width:80%;height:39%;transform:rotate(180deg)}
    .paper--garden:hover .garden-branch-b {transform:rotate(182deg)}

    /* 2: Gran Reserva, editorial grená */
    .paper--wine { --paper:#591e2c;--ink:#e4cdaa; background:linear-gradient(120deg,#612332,#4e1928); }
    .wine-frame {position:absolute;inset:4.5%;border:1px solid #be9b6e;opacity:.75}
    .wine-frame::after{content:'';position:absolute;inset:1.3%;border:1px solid rgba(228,190,139,.28)}
    .paper--wine .paper__content {padding:12% 10% 10%}
    .wine-monogram {font-family:var(--serif);font-size:7cqw;letter-spacing:.19em;}
    .wine-title {font-family:var(--serif);font-size:10.7cqw;letter-spacing:.09em;line-height:1.07;text-transform:uppercase;margin-top:11%;}
    .wine-and {font-family:var(--script);font-size:13cqw;line-height:1.08;margin-top:1%;}
    .wine-rule {width:36%;margin:7% 0 6%;}
    .wine-description {font-family:var(--serif);font-style:italic;font-size:4cqw;line-height:1.35}
    .wine-time {font-family:var(--serif);font-size:7cqw;letter-spacing:.07em;margin-top:6%}
    .wine-bottom {margin-top:auto;display:flex;flex-direction:column;gap:4px}
    .gold-ornament { position:absolute; bottom:5%;left:8%;height:17%;width:84%;opacity:.3;pointer-events:none; }

    /* 3: Azul Provençal, leve e ilustrado */
    .paper--blue {--paper:#f7f7f3;--ink:#3e5d69}
    .paper--blue .paper__content {padding:14% 10% 8%}
    .blue-name {font-family:var(--serif);font-style:italic;font-size:16cqw;line-height:.8;margin-top:19%;}
    .blue-and {font-family:var(--script);font-size:11cqw;margin:5% 0 0}
    .blue-name.second {margin-top:0}
    .blue-rule {width:40%;margin:12% 0 6%}
    .blue-date {font-family:var(--serif);font-size:9cqw;line-height:1}
    .blue-location {margin-top:5%}
    .blue-closing {margin-top:auto;font-family:var(--serif);font-size:4.2cqw;font-style:italic}
    .blue-branch-a {left:-24%;bottom:-24%;width:70%;height:37%}
    .blue-branch-b {right:-26%;top:-19%;width:75%;height:38%;transform:rotate(179deg)}
    .paper--blue:hover .blue-branch-b {transform:rotate(181deg)}

    /* 4: Novo Clássico — serifas e geometria */
    .paper--modern {--paper:#ece7dc;--ink:#292a28}
    .modern-spine {position:absolute;top:0;left:11%;bottom:0;width:1px;background:#a79d8c;opacity:.8}
    .paper--modern .paper__content {padding:13% 12% 9%;align-items:flex-start;text-align:left}
    .modern-head {font-family:var(--ui);font-size:2.2cqw;letter-spacing:.29em;text-transform:uppercase}
    .modern-index {font-family:var(--serif);font-size:9cqw;line-height:1;margin-top:12%;color:#a48a6a}
    .modern-names {font-family:var(--serif);font-size:14cqw;font-weight:500;line-height:.86;margin-top:7%;letter-spacing:-.045em}
    .modern-names em {font-weight:400;font-size:8cqw;display:block;margin:5% 0;font-style:italic}
    .modern-line {margin-top:auto;width:100%;height:1px;background:#918574;}
    .modern-date {display:grid;grid-template-columns:1fr 1fr;gap:7%;width:100%;margin-top:7%;}
    .modern-date strong {font-family:var(--serif);font-size:8cqw;line-height:1;font-weight:400;display:block}
    .modern-date span {font-family:var(--ui);font-size:2.2cqw;letter-spacing:.09em;line-height:1.5;display:block;margin-top:5%;}
    .modern-symbol {position:absolute;top:15%;right:-11%;height:39%;width:60%;opacity:.55}

    /* 5: Rosa Antiga — minimal botânico */
    .paper--blush {--paper:#f8f0ec;--ink:#694e50}
    .blush-border {position:absolute;inset:5.7%;border:1px solid rgba(145,100,100,.55);border-radius:0 52% 0 0 / 0 22% 0 0;transition:border-radius .8s var(--ease)}
    .paper--blush:hover .blush-border {border-radius:0 46% 0 0 / 0 18% 0 0}
    .paper--blush .paper__content {padding:15% 11% 10%}
    .blush-monogram {font-family:var(--serif);font-size:8.6cqw;letter-spacing:.18em}
    .blush-tag {margin-top:9%}
    .blush-name {font-family:var(--serif);font-size:15cqw;line-height:.87;letter-spacing:-.05em;margin-top:14%;}
    .blush-between {font-family:var(--script);font-size:12cqw;line-height:1.0;margin-top:6%;}
    .blush-name.second {margin-top:0}
    .blush-rule {width:25%;margin:11% 0 8%}
    .blush-date {font-family:var(--serif);font-size:6.5cqw;letter-spacing:.05em}
    .blush-location {margin-top:6%}
    .blush-footer {margin-top:auto;font-family:var(--serif);font-size:4.3cqw;font-style:italic}
    .blush-branch-a {left:-40%;bottom:-33%;width:92%;height:48%;opacity:.75;}

    /* 6: Lacre digital: abertura real */
    .paper--envelope {--paper:#f5efe7;--ink:#705b4b; perspective:1200px;cursor:default;background:#f4ede4;}
    .envelope-inside {position:absolute;inset:0;background:#f8f4ed;padding:9% 8%;display:flex;flex-direction:column;align-items:center;z-index:1;}
    .envelope-inside .inner-top {font-size:2.8cqw;letter-spacing:.24em;margin-top:4%}
    .envelope-inside .inner-name {font-family:var(--serif);font-style:italic;font-size:13.5cqw;line-height:.9;margin-top:16%}
    .envelope-inside .inner-and {font-family:var(--script);font-size:10cqw;line-height:1.1;margin-top:5%}
    .envelope-inside .inner-name.second {margin-top:0}
    .envelope-inside .inner-line {width:35%;margin:12% 0 7%}
    .envelope-inside .inner-date {font-size:5.7cqw;font-family:var(--serif)}
    .envelope-inside .inner-venue {margin-top:7%}
    .envelope-inside .inner-message {margin-top:auto;margin-bottom:9%;font-family:var(--serif);font-size:3.9cqw;font-style:italic}
    .envelope-flap { position:absolute;top:0;bottom:0;width:50%;z-index:3;background:#efe5d9; backface-visibility:hidden;transition:transform 1.15s var(--ease),filter 1.15s ease; box-shadow: inset 0 0 25px rgba(105,78,60,.035); }
    .envelope-flap--left {left:0;transform-origin:left center;border-right:1px solid rgba(142,116,96,.13)}
    .envelope-flap--right {right:0;transform-origin:right center;background:#f4eae0;border-left:1px solid rgba(142,116,96,.13)}
    .envelope-fold {position:absolute;top:0;bottom:0;width:100%;opacity:.36;}
    .envelope-flap--left .envelope-fold {background:linear-gradient(90deg,transparent 68%,rgba(108,81,57,.2))}
    .envelope-flap--right .envelope-fold {background:linear-gradient(90deg,rgba(108,81,57,.19),transparent 32%)}
    .envelope-flowers {position:absolute;top:20%;left:38%;width:62%;height:43%;z-index:4;pointer-events:none;transition:opacity .32s,transform .85s var(--ease)}
    .wax-seal {position:absolute;top:49%;left:50%;z-index:6;transform:translate(-50%,-50%);width:19%;aspect-ratio:1;border:0;border-radius:50%;cursor:pointer;color:#8e642a;background:radial-gradient(circle at 36% 26%,#fbe2a0 0,#d4ab5f 46%,#ad7a2d 83%,#e6c47c 100%);box-shadow:0 1px 0 2px #cc9f4a,0 5px 14px rgba(95,72,45,.21),inset 0 0 0 5px rgba(167,114,35,.12);transition:transform .35s var(--ease),opacity .35s;display:grid;place-items:center;}
    .wax-seal::before {content:'';position:absolute;inset:9%;border:1px solid rgba(151,103,30,.33);border-radius:50%}
    .wax-seal span {font-family:var(--serif);font-size:7cqw;font-style:italic}
    .wax-seal:hover {transform:translate(-50%,-50%) scale(1.09)}
    .envelope-instruction {position:absolute;top:62%;left:0;right:0;z-index:5;text-align:center;color:#92754e;font-family:var(--serif);font-style:italic;font-size:5.1cqw;pointer-events:none;transition:opacity .25s}
    .paper--envelope.open .envelope-flap--left {transform:rotateY(-112deg)}
    .paper--envelope.open .envelope-flap--right {transform:rotateY(112deg)}
    .paper--envelope.open .envelope-flowers,.paper--envelope.open .envelope-instruction {opacity:0;transform:translateY(-7%)}
    .paper--envelope.open .wax-seal {opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.75)}
    .reclose {position:absolute;bottom:2%;left:50%;z-index:10;transform:translateX(-50%);color:#6b5849;font-family:var(--ui);font-size:2.25cqw;letter-spacing:.18em;text-transform:uppercase;border:0;border-bottom:1px solid #a48b70;background:transparent;padding:1.5%;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .25s .6s}
    .paper--envelope.open .reclose {opacity:1;pointer-events:auto}


    /* 04-B — Três convites de referência, abertura em portas 3D e QR legível */
    .invite-shell.is-gate { aspect-ratio: var(--gate-ratio, 2 / 3); }
    .gate { position:absolute;inset:0;container-type:inline-size;perspective:1500px;overflow:hidden;border-radius:3px;background:var(--gate-paper);color:var(--gate-ink);isolation:isolate; }
    .gate--floral { --gate-paper:#f5f4ec; --gate-ink:#59634b; --gate-accent:#a48e65; --gate-petal:#c3d3e6; }
    .gate--azul { --gate-paper:#fcfbed; --gate-ink:#173d6b; --gate-accent:#274b77; --gate-petal:#204e85; }
    .gate--verde { --gate-paper:#092927; --gate-ink:#e4ca91; --gate-accent:#d7ae67; --gate-petal:#d9bb82; }
    .gate__interior {position:absolute;inset:0;z-index:1;display:grid;place-items:center;background:var(--gate-paper);}
    .gate__art {display:block;width:100%;height:100%;object-fit:contain;}
    .gate__interior::after {content:'';position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(80,66,44,.06)}
    .gate__door {position:absolute;top:0;bottom:0;width:50.06%;z-index:4;transform-style:preserve-3d;backface-visibility:hidden;background:var(--gate-paper);transition:transform 1150ms cubic-bezier(.2,.7,.14,1),filter 850ms;overflow:hidden;box-shadow:inset 0 0 30px rgba(0,0,0,.025);}
    .gate__door--left {left:0;transform-origin:left center;box-shadow:inset -7px 0 12px rgba(50,34,34,.055)}
    .gate__door--right {right:0;transform-origin:right center;box-shadow:inset 7px 0 12px rgba(50,34,34,.045)}
    .gate__door::before {content:'';position:absolute;top:4%;bottom:4%;width:calc(100% - 12%);border-top:1px solid var(--gate-accent);border-bottom:1px solid var(--gate-accent);opacity:.7;}
    .gate__door--left::before {left:10%;border-left:1px solid var(--gate-accent)}
    .gate__door--right::before {right:10%;border-right:1px solid var(--gate-accent)}
    .gate__door::after {content:'';position:absolute;inset:0;pointer-events:none;opacity:.20;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 128 128' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.7' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.06'/%3E%3C/svg%3E")}
    .gate__botanical {position:absolute;left:0;top:7%;width:100%;height:26%;opacity:.66;pointer-events:none;transition:transform 850ms;}
    .gate__door--right .gate__botanical {top:auto;bottom:6%;transform:rotate(180deg)}
    .gate--azul .gate__botanical {opacity:.87}
    .gate--verde .gate__botanical {opacity:.43;filter:sepia(1)}
    .gate__midline {position:absolute;top:0;bottom:0;width:1px;background:rgba(41,28,18,.12);}
    .gate__door--left .gate__midline {right:0}
    .gate__door--right .gate__midline {left:0}
    .gate__cover-text {position:absolute;left:0;right:0;top:37%;z-index:5;display:flex;flex-direction:column;align-items:center;gap:1.4cqw;pointer-events:none;text-align:center;letter-spacing:.10em;opacity:1;transition:opacity .25s;}
    .gate__cover-title {font:500 5cqw var(--serif);text-transform:uppercase;letter-spacing:.22em;white-space:nowrap}
    .gate__cover-sub {font:italic 4cqw var(--serif);letter-spacing:.07em}
    .gate__seal {position:absolute;top:54%;left:50%;z-index:7;transform:translate(-50%,-50%);width:19%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;border:2px solid rgba(251,227,168,.55);background:radial-gradient(circle at 32% 25%,#f6e0a7,#c99f59 52%,#9b713d 85%);box-shadow:0 3px 15px rgba(25,19,11,.19),inset 0 0 0 4px rgba(112,77,35,.22);color:#624829;font:italic 8cqw var(--serif);cursor:pointer;transition:transform .35s,opacity .3s;}
    .gate__seal:hover {transform:translate(-50%,-50%) scale(1.07)}
    .gate--azul .gate__seal {background:radial-gradient(circle at 32% 25%,#7595b9,#2c5686 57%,#173557);border-color:#bccbdd;box-shadow:0 4px 15px rgba(6,19,38,.25),inset 0 0 0 4px rgba(215,229,246,.15);color:#faf5e3;}
    .gate__invite-hint {position:absolute;top:64%;width:100%;text-align:center;z-index:5;font:italic 4.5cqw var(--serif);letter-spacing:.05em;pointer-events:none;transition:opacity .25s;}
    .gate.is-open .gate__door--left {transform:rotateY(-110deg)}
    .gate.is-open .gate__door--right {transform:rotateY(110deg)}
    .gate.is-open .gate__seal,.gate.is-open .gate__cover-text,.gate.is-open .gate__invite-hint {opacity:0;pointer-events:none}
    .gate__qr {position:absolute;z-index:2;right:3.5%;bottom:3%;width:17%;padding:1.4%;background:#fffdf5;border:1px solid var(--gate-accent);border-radius:2px;display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:0 1px 9px rgba(16,18,11,.10);}
    .gate__qr img {display:block;width:100%;height:auto;image-rendering:pixelated;}
    .gate__qr span {color:#463a32;text-align:center;text-transform:uppercase;font-family:var(--ui);font-size:1.55cqw;font-weight:600;line-height:1.2;letter-spacing:.02em}
    .gate--azul .gate__qr {right:3%;bottom:3%;border-color:#284c70}
    .gate--verde .gate__qr {border-color:#c5a666}
    .gate__open-actions {position:absolute;z-index:3;bottom:2.5%;left:50%;transform:translateX(-50%);display:flex;gap:1.3cqw;opacity:0;pointer-events:none;transition:opacity .3s .7s;}
    .gate.is-open .gate__open-actions {opacity:1;pointer-events:auto}
    .gate__action {background:rgba(255,253,246,.95);border:1px solid var(--gate-accent);color:#4a3c35;font:600 2.1cqw var(--ui);text-transform:uppercase;letter-spacing:.08em;padding:1.5cqw 2cqw;border-radius:2px;white-space:nowrap;cursor:pointer;}
    .gate__action:hover {background:#f3e9d8}
    .gate--verde .gate__action {background:#e7d6b5;color:#14302f}
    .gate__action:focus-visible,.gate__seal:focus-visible {outline:2px solid #cba45e;outline-offset:3px}
    .lightbox__card.is-gate {aspect-ratio:var(--gate-ratio, 2 / 3);}
    .lightbox__card .gate__door,.lightbox__card .gate__seal,.lightbox__card .gate__cover-text,.lightbox__card .gate__invite-hint,.lightbox__card .gate__open-actions{display:none}
    .lightbox__card .gate__qr {width:19%}

    /* 05 — Modal de zoom / foto completa do layout */
    .lightbox {position:fixed;inset:0;z-index:30;background:rgba(28,11,18,.91);backdrop-filter:blur(11px);-webkit-backdrop-filter:blur(11px);display:grid;place-items:center;opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s;padding:24px;}
    .lightbox.is-visible {opacity:1;visibility:visible;}
    .lightbox__area {position:relative;display:grid;place-items:center;width:100%;height:100%;min-height:0;}
    .lightbox__card {position:relative;width:min(560px, 88vw, calc(87svh * .6667));aspect-ratio:2 / 3;box-shadow:0 36px 70px rgba(0,0,0,.32);transform:translateY(18px) scale(.96);transition:transform .5s var(--ease)}
    .lightbox.is-visible .lightbox__card {transform:translateY(0) scale(1)}
    .lightbox__close {position:absolute;top:clamp(16px,4vw,34px);right:clamp(16px,4vw,34px);z-index:40;border:1px solid rgba(231,205,174,.6);width:44px;aspect-ratio:1;background:transparent;color:#f1decb;border-radius:50%;font-size:25px;display:grid;place-items:center;cursor:pointer;line-height:1}
    .lightbox__close:hover {background:rgba(255,255,255,.1)}
    body.lock-scroll {overflow:hidden;}

    /* 06 — Movimento e responsividade */
    @keyframes fade-in {to{opacity:1}}
    @keyframes enter-up {from{opacity:0;transform:translateY(13px)}to{opacity:1;transform:translateY(0)}}
    @keyframes enter-down {from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes card-intro {to{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes switch-in {from{opacity:.35;transform:translateY(12px) scale(.975)}to{opacity:1;transform:translateY(0) scale(1)}}
    @media (max-width:650px){
      :root {--card-width:min(70vw,calc(68svh * .6667));}
      .portfolio{padding:20px 7px 18px}
      .micro-header__eyebrow {font-size:9px;letter-spacing:.22em;}
      .gallery{grid-template-columns:43px minmax(0,1fr) 43px;gap:0;}
      .stage{height:75svh;min-height:330px;}
      .nav{width:37px;}
      .nav svg{width:16px;height:16px}
      .foot {padding:0 17px;align-items:center;}
      .foot__name{font-size:19px}
      .foot__hint{font-size:9px;letter-spacing:.05em;white-space:normal}
      .foot__right{gap:10px}.progress{width:52px}
      .lightbox{padding:11px}
      .lightbox__card {width:min(91vw,calc(86svh * .6667));}
    }
    @media (max-height:650px) and (min-width:651px){
      :root{--card-width:min(380px, 70vw, calc(72svh * .6667))}
      .stage{height:73svh;min-height:250px}
    }

  </style>

    /* 09 — Carrossel, zoom, movimentos e acessibilidade */
    const $ = (selector) => document.querySelector(selector);
    const stage = $('#stage'), shell = $('#inviteShell');
    const modal = $('#lightbox'), modalCard = $('#lightboxCard');
    const styleName = $('#styleName'), hint = $('#hint');
    let active = 0, lastFocus = null, startX = null;

    function setIndex(number, isInitial=false) {
      active = (number + invites.length) % invites.length;
      const item = invites[active];
      shell.innerHTML = item.html;
      shell.className = 'invite-shell' + (item.envelope ? ' is-envelope' : '') + (item.gate ? ' is-gate' : '') + (isInitial ? '' : ' is-ready');
      shell.style.setProperty('--gate-ratio', item.ratio || '.66667');
      shell.style.transform = '';
      shell.setAttribute('role', item.envelope ? 'group' : 'button');
      shell.setAttribute('aria-label', item.envelope ? 'Convite animado com lacre para abrir' : `Ampliar ${item.name}`);
      shell.tabIndex = item.envelope ? -1 : 0;
      styleName.textContent = item.name;
      hint.textContent = item.hint;
      $('#currentIndex').textContent = String(active + 1).padStart(2,'0');
      $('#totalCards').textContent = String(invites.length).padStart(2,'0');
      $('#progressBar').style.transform = `scaleX(${active + 1})`;
      if (!isInitial) { shell.classList.add('switching'); shell.addEventListener('animationend',function onSwitchEnd(event){if(event.target !== shell)return;shell.classList.remove('switching');shell.removeEventListener('animationend',onSwitchEnd);}); }
    }
    const navigate = (direction) => setIndex(active + direction);
    $('#prev').addEventListener('click',()=>navigate(-1));
    $('#next').addEventListener('click',()=>navigate(1));
    shell.addEventListener('click',e=>{
      const action = e.target.closest('[data-action]');
      if (action) {
        e.stopPropagation();
        if (action.dataset.action === 'zoom') {openZoom();return;}
        const envelope = shell.querySelector('[data-envelope]');
        envelope.classList.toggle(invites[active].gate ? 'is-open' : 'open', action.dataset.action === 'open');
        return;
      }
      if (invites[active].envelope) {
        const envelope = shell.querySelector('[data-envelope]');
        const isOpen = envelope.classList.contains(invites[active].gate ? 'is-open' : 'open');
        if (!isOpen) {
          envelope.classList.add(invites[active].gate ? 'is-open' : 'open');
        }
        return;
      }
      openZoom();
    });
    shell.addEventListener('keydown',e=>{
      if ((e.key==='Enter' || e.key===' ') && !invites[active].envelope) {e.preventDefault();openZoom();}
    });
    shell.addEventListener('pointermove',e=>{
      if (e.pointerType==='touch' || invites[active].envelope || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const rect = shell.getBoundingClientRect();
      const x = (e.clientX - rect.left)/rect.width - .5;
      const y = (e.clientY - rect.top)/rect.height - .5;
      shell.classList.add('leaning');
      shell.style.transform = `perspective(1300px) rotateX(${-y*5}deg) rotateY(${x*6}deg) translateY(-3px) scale(1.013)`;
    });
    shell.addEventListener('pointerleave',()=>{shell.style.transform='';shell.classList.remove('leaning');});
    function openZoom(){
      lastFocus = document.activeElement;
      modalCard.innerHTML = invites[active].html;
      modalCard.classList.toggle('is-gate',Boolean(invites[active].gate));
      modalCard.style.setProperty('--gate-ratio',invites[active].ratio || '.66667');
      modal.classList.add('is-visible');
      modal.setAttribute('aria-hidden','false');
      document.body.classList.add('lock-scroll');
      $('#closeLightbox').focus();
    }
    function closeZoom(){
      modal.classList.remove('is-visible');
      modal.setAttribute('aria-hidden','true');
      document.body.classList.remove('lock-scroll');
      modalCard.innerHTML = '';
      modalCard.classList.remove('is-gate');
      if(lastFocus?.focus) lastFocus.focus();
    }
    $('#closeLightbox').addEventListener('click',closeZoom);
    modal.addEventListener('click',e=>{if(e.target===modal || e.target.classList.contains('lightbox__area')) closeZoom();});
    document.addEventListener('keydown',e=>{
      if (modal.classList.contains('is-visible')) {
        if (e.key==='Escape') closeZoom();
        return;
      }
      if(e.key==='ArrowRight') navigate(1);
      if(e.key==='ArrowLeft') navigate(-1);
    });
    stage.addEventListener('touchstart',e=>{startX=e.changedTouches[0]?.screenX??null;},{passive:true});
    stage.addEventListener('touchend',e=>{
      if(startX===null)return;
      const delta=e.changedTouches[0].screenX-startX;
      if(Math.abs(delta)>65)navigate(delta<0?1:-1);
      startX=null;
    },{passive:true});
    setIndex(0,true);
  </script>
</body>
</html>
